<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI文旅手绘涂鸦风 — Hook Scene</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap");

    :root {
      --bg: #F5EFE0;
      --fg: #2A1F14;
      --accent: #D4602A;
      --muted: #8B7355;
      --surface: #EDE4D0;
      --border: #C4A97A;
      --highlight: #E8A84C;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      font-family: 'Noto Sans SC', sans-serif;
      color: var(--fg);
      overflow: hidden;
    }

    /* Paper grain overlay */
    .grain-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1000;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* Main stage */
    #stage {
      width: 1920px;
      height: 1080px;
      position: relative;
    }

    .scene-content {
      width: 100%;
      height: 100%;
      padding: 100px 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    /* Ghost text */
    .ghost-text {
      position: absolute;
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 280px;
      color: var(--accent);
      opacity: 0.06;
      letter-spacing: -0.05em;
      white-space: nowrap;
      pointer-events: none;
    }

    /* Timeline bar */
    .timeline-bar {
      position: absolute;
      bottom: 200px;
      left: 140px;
      right: 140px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      transform-origin: left center;
      transform: scaleX(0);
    }

    .timeline-marker {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .timeline-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--bg);
      box-shadow: 0 0 0 2px var(--accent);
    }

    .timeline-label {
      font-family: 'ZCOOL QingKe HuangYou', monospace;
      font-size: 22px;
      color: var(--muted);
      position: absolute;
      top: 28px;
      white-space: nowrap;
    }

    .timeline-label span {
      display: block;
      font-size: 14px;
      color: var(--border);
      margin-top: 2px;
    }

    /* Year headline */
    .headline-year {
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 200px;
      font-weight: 700;
      color: var(--fg);
      line-height: 1;
      letter-spacing: -0.03em;
      position: relative;
      display: inline-block;
    }

    .headline-year::after {
      content: '年';
      font-size: 60px;
      position: absolute;
      right: -80px;
      top: 20px;
      color: var(--accent);
    }

    /* Sub text */
    .sub-text {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 36px;
      color: var(--muted);
      margin-top: 20px;
      font-weight: 400;
    }

    /* Coffee doodle */
    .coffee-doodle {
      position: absolute;
      right: 200px;
      top: 50%;
      transform: translateY(-50%);
      width: 180px;
      height: 180px;
      opacity: 0.85;
    }

    .coffee-doodle svg {
      width: 100%;
      height: 100%;
    }

    /* Annotation tag */
    .annotation-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      font-family: 'ZCOOL QingKe HuangYou', monospace;
      font-size: 20px;
      color: var(--accent);
      margin-top: 24px;
    }

    .annotation-tag::before {
      content: '📍';
      font-size: 16px;
    }

    /* Ink splatter decorations */
    .ink-splatter {
      position: absolute;
      width: 60px;
      height: 60px;
      opacity: 0.15;
      pointer-events: none;
    }

    .ink-splatter-1 { bottom: 60px; left: 80px; }
    .ink-splatter-2 { top: 120px; right: 120px; }

    /* Decorative lines */
    .deco-line {
      position: absolute;
      height: 2px;
      background: var(--border);
      transform-origin: left center;
      transform: scaleX(0);
    }

    .deco-line-1 { top: 140px; left: 140px; width: 300px; }
    .deco-line-2 { bottom: 160px; right: 200px; width: 200px; }
  </style>
</head>
<body>
  <div class="grain-overlay"></div>

  <div id="stage" data-composition-id="hook-scene" data-width="1920" data-height="1080">
    <div class="scene-content">
      <!-- Ghost text -->
      <div class="ghost-text" id="ghost-text">广州咖啡</div>

      <!-- Decorative lines -->
      <div class="deco-line deco-line-1" id="deco-line-1"></div>
      <div class="deco-line deco-line-2" id="deco-line-2"></div>

      <!-- Headline -->
      <div class="headline-year" id="headline-year">1836</div>
      <div class="sub-text" id="sub-text">中国第一家咖啡馆，竟然在广州荔湾</div>
      <div class="annotation-tag" id="annotation-tag">荔湾区 · 骑楼 · 永庆坊 · 沙面</div>

      <!-- Timeline bar -->
      <div class="timeline-bar" id="timeline-bar">
        <div class="timeline-marker" style="left: 0">
          <div class="timeline-dot"></div>
          <div class="timeline-label">1836<span>十三行</span></div>
        </div>
        <div class="timeline-marker" style="left: 33%">
          <div class="timeline-dot"></div>
          <div class="timeline-label">1905<span>芳村烘焙</span></div>
        </div>
        <div class="timeline-marker" style="left: 66%">
          <div class="timeline-dot"></div>
          <div class="timeline-label">Now<span>永庆坊</span></div>
        </div>
      </div>

      <!-- Coffee doodle -->
      <div class="coffee-doodle" id="coffee-doodle">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Cup body -->
          <path d="M20 35 L25 85 L75 85 L80 35 Z" stroke="#D4602A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="300" stroke-dashoffset="300" id="cup-outline"/>
          <!-- Steam -->
          <path d="M35 28 Q40 18 35 10 M50 25 Q55 15 50 5 M65 28 Q70 18 65 10" stroke="#8B7355" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
          <!-- Handle -->
          <path d="M80 45 Q95 45 95 60 Q95 75 80 75" stroke="#D4602A" stroke-width="4" stroke-linecap="round" fill="none"/>
          <!-- Heart in coffee -->
          <path d="M50 55 C45 50 40 55 50 65 C60 55 55 50 50 55" fill="#D4602A" opacity="0.8"/>
        </svg>
      </div>

      <!-- Ink splatters -->
      <div class="ink-splatter ink-splatter-1">
        <svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="20" fill="#2A1F14"/><circle cx="15" cy="15" r="8" fill="#2A1F14"/><circle cx="45" cy="20" r="6" fill="#2A1F14"/></svg>
      </div>
      <div class="ink-splatter ink-splatter-2">
        <svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="25" fill="#D4602A"/><circle cx="10" cy="40" r="7" fill="#D4602A"/></svg>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};

    const tl = gsap.timeline({ paused: true });

    // Ghost text drift
    gsap.set("#ghost-text", { x: -60, opacity: 0 });
    tl.to("#ghost-text", { x: 40, opacity: 0.06, duration: 4, ease: "none" }, 0);

    // Decorative lines draw in
    tl.to("#deco-line-1", { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.1);
    tl.to("#deco-line-2", { scaleX: 1, duration: 0.3, ease: "power2.out" }, 0.2);

    // Headline year SLAM in
    gsap.set("#headline-year", { scale: 0.5, rotation: -5, opacity: 0 });
    tl.to("#headline-year", { scale: 1, rotation: 0, opacity: 1, duration: 0.6, ease: "back.out(2)" }, 0.3);

    // Sub text slides up
    gsap.set("#sub-text", { y: 30, opacity: 0 });
    tl.to("#sub-text", { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.5);

    // Annotation tag drops in
    gsap.set("#annotation-tag", { y: -20, opacity: 0 });
    tl.to("#annotation-tag", { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.4)" }, 0.7);

    // Timeline bar draws left-to-right
    tl.to("#timeline-bar", { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 0.8);

    // Cup outline draws
    tl.to("#cup-outline", { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 1.0);

    // Coffee doodle bob animation (ambient loop handled separately)
    gsap.set("#coffee-doodle", { y: 20, opacity: 0 });
    tl.to("#coffee-doodle", { y: 0, opacity: 0.85, duration: 0.5, ease: "back.out(1.4)" }, 1.2);

    // Continuous bob for coffee cup
    gsap.to("#coffee-doodle", {
      y: -8,
      duration: 1.8,
      ease: "sine.inOut",
      yoyo: true,
      repeat: -1,
      delay: 1.7
    });

    window.__timelines["hook-scene"] = tl;
  </script>
</body>
</html>
